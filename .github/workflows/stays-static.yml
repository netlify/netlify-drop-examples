name: Stays static

# Netlify Drop publishes this project for logged-out visitors. That only works
# while it needs no build step: if build detection trips, Drop sends them to
# signup instead of publishing, which is the dead end this example exists to
# avoid. Nothing about editing the site makes that visible, so it is enforced
# here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  stays-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject files that trigger a build
        run: |
          found=$(git ls-files 'package.json' 'package-lock.json' 'yarn.lock' 'pnpm-lock.yaml')
          if [ -n "$found" ]; then
            echo "::error::This project must stay static, but it contains: $found"
            echo "Netlify Drop would treat it as needing a build and send logged-out visitors to signup."
            exit 1
          fi

      - name: Reject a netlify.toml with a [build] section
        run: |
          if [ -f netlify.toml ] && grep -q '^\[build\]' netlify.toml; then
            echo "::error::netlify.toml must not declare a [build] section."
            exit 1
          fi

      - name: Require index.html at the root
        run: test -f index.html || { echo "::error::index.html must stay at the repository root."; exit 1; }

      - name: Check manifest.json matches the files on disk
        run: |
          listed=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).files.sort().join('\n'))")
          actual=$(git ls-files | grep -vE '^(\.github/.*|\.gitignore|manifest\.json|_headers)$' | sort)
          if [ "$listed" != "$actual" ]; then
            echo "::error::manifest.json does not match the files in the repo."
            diff <(echo "$listed") <(echo "$actual") || true
            exit 1
          fi
